<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Student Management System</h1>
      <!-- Student Form -->
      <form id="studentForm">
        <div class="form-group">
          <label for="studentName">Student Name</label>
          <input
            type="text"
            id="studentName"
            placeholder="Enter student name"
          />
          <small id="nameError"></small>
        </div>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Enter email" />
          <small id="emailError"></small>
        </div>
        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="phone" placeholder="Enter phone number" />
          <small id="phoneError"></small>
        </div>
        <div class="form-group">
          <label for="course">Course</label>
          <select id="course">
            <option value="">Select Course</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="JavaScript">JavaScript</option>
            <option value="React">React</option>
            <option value="Node.js">Node.js</option>
          </select>
          <small id="courseError"></small>
        </div>
        <div class="form-group">
          <label for="marks">Marks</label>
          <input
            type="number"
            id="marks"
            placeholder="Enter marks"
            min="0"
            max="100"  />
          <small id="marksError"></small>
        </div>
        <button type="submit" id="submitBtn">Add Student</button>
      </form>
      <!-- Search and Filter -->
      <div class="controls">
        <div>
          <label for="searchInput">Search Student</label>
          <input type="text" id="searchInput" placeholder="Search by name" />
        </div>
        <div>
          <label for="filterCourse">Filter by Course</label>
          <select id="filterCourse">
            <option value="">All Courses</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="JavaScript">JavaScript</option>
            <option value="React">React</option>
            <option value="Node.js">Node.js</option>
          </select>
        </div>
      </div>
      <!-- Student Table -->
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Course</th>
              <th>Marks</th>
              <th>Grade</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="studentTableBody">
            <!-- JavaScript will add students here -->
          </tbody>
        </table>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
